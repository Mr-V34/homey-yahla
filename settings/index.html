<!DOCTYPE html>
<html>
<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid rgba(128,128,128,.25); }
    .row .who { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; }
    .row .who small { display: block; opacity: .7; }
    .warn { font-weight: 600; }
    .muted { opacity: .7; }
    button.small { padding: 4px 10px; }
    details.dev { border-bottom: 1px solid rgba(128,128,128,.25); padding: 8px 0; }
    details.dev summary { cursor: pointer; overflow-wrap: anywhere; }
    details.dev summary small { opacity: .7; margin-left: 6px; }
    details.dev .info { padding: 6px 0 4px 16px; }
    details.dev .info div { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title" data-i18n="settings.title"></h1>
    <p class="homey-subtitle" data-i18n="settings.intro"></p>
  </header>

  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-i18n="settings.status"></legend>
    <p id="status"></p>
    <p id="warnings" class="warn"></p>
  </fieldset>

  <fieldset class="homey-form-fieldset" id="unlockBox" style="display: none">
    <legend class="homey-form-legend" data-i18n="settings.unlockTitle"></legend>
    <div class="homey-form-group">
      <input class="homey-form-input" id="unlockPin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" />
    </div>
    <button id="unlock" class="homey-button-primary-full" data-i18n="settings.unlock"></button>
  </fieldset>

  <p id="result" class="warn"></p>

  <div id="content" style="display: none">
    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" data-i18n="settings.newDevices"></legend>
      <div id="newList"></div>
    </fieldset>

    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" data-i18n="settings.knownDevices"></legend>
      <div id="knownList"></div>
    </fieldset>

    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" data-i18n="settings.senders"></legend>
      <p class="muted" data-i18n="settings.sendersHelp"></p>
      <div class="homey-form-group">
        <input class="homey-form-input" id="senders" type="text" autocomplete="off" maxlength="100" />
      </div>
      <div id="seenSenders"></div>
    </fieldset>

    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" data-i18n="settings.logTitle"></legend>
      <p class="muted" data-i18n="settings.logHelp"></p>
      <select class="homey-form-select" id="logLevel">
        <option value="minimum" data-i18n="settings.log.minimum"></option>
        <option value="extended" data-i18n="settings.log.extended"></option>
        <option value="debug" data-i18n="settings.log.debug"></option>
      </select>
    </fieldset>

    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" data-i18n="settings.networks"></legend>
      <p class="muted" data-i18n="settings.networksHelp"></p>
      <div id="networkList"></div>
      <button id="saveConfig" class="homey-button-primary-full" data-i18n="settings.saveConfig"></button>
    </fieldset>

    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" data-i18n="settings.pinTitle"></legend>
      <p class="muted" data-i18n="settings.pinHelp"></p>
      <div class="homey-form-group">
        <label class="homey-form-label" for="newPin" data-i18n="settings.newPin"></label>
        <input class="homey-form-input" id="newPin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" />
      </div>
      <button id="savePin" class="homey-button-secondary-full" data-i18n="settings.savePin"></button>
      <button id="removePin" class="homey-button-secondary-full" style="display: none" data-i18n="settings.removePin"></button>
    </fieldset>
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      var LEVELS = ['NONE', 'INFO', 'WARNING', 'HIGH', 'CRITICAL'];
      var $ = function (id) { return document.getElementById(id); };
      var config = null;
      var networks = [];
      var token = null;        // session from /unlock; kept in this page only
      var lastStatus = null;
      var formLoaded = false;  // senders and levels are filled once and after a save,
                               // so a refresh never overwrites what the owner is typing

      // Everything from the app is shown as text, never as HTML.
      function el(tag, text, cls) {
        var e = document.createElement(tag);
        if (text !== undefined && text !== null) e.textContent = String(text);
        if (cls) e.className = cls;
        return e;
      }
      function t(key, tokens) { return Homey.__('settings.' + key, tokens) || key; }
      function when(ms) { return ms ? new Date(ms).toLocaleString() : '-'; }
      function netLabel(key) {
        if (!key) return '-';
        if (key.indexOf('vlan:') === 0) return 'VLAN ' + key.slice(5);
        return key.slice(5);
      }
      function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
      function setShown(node, shown) { node.style.display = shown ? '' : 'none'; }
      function unlocked() { return Boolean(lastStatus && lastStatus.unlocked); }
      var openMacs = {}; // folds the owner has opened stay open across refreshes

      function show(err, r) {
        if (err) { $('result').textContent = t('code.error'); return; }
        if (r.code === 'needUnlock') token = null;
        $('result').textContent = r.code === 'done' ? '' : t('code.' + r.code, {
          left: String(r.triesLeft !== undefined ? r.triesLeft : ''),
          until: lastStatus ? when(lastStatus.lockedUntil) : '-',
        });
      }

      function act(mac, action) {
        Homey.api('POST', '/device', { token: token, mac: mac, action: action }, function (err, r) {
          show(err, r);
          refresh();
        });
      }

      function addButtons(row, d, actions) {
        actions.forEach(function (a) {
          var b = el('button', t('action.' + a), 'homey-button-secondary small');
          b.addEventListener('click', function () { act(d.mac, a); });
          row.appendChild(b);
        });
      }

      // The end of the MAC is always shown next to a name, since a device can
      // give itself any name, also one that copies a trusted device.
      function macTail(mac) { return '...' + mac.slice(-5); }

      function deviceRow(d, actions) {
        var row = el('div', null, 'row');
        var who = el('div', d.mac, 'who');
        who.appendChild(el('small', t('deviceLine', {
          name: d.name || '-', ip: d.ip || '-', network: netLabel(d.network), where: d.where || '-', last: when(d.lastSeen),
        })));
        if (d.state !== 'new') who.appendChild(el('small', t('state.' + d.state)));
        row.appendChild(who);
        addButtons(row, d, actions);
        return row;
      }

      function levelSelect(id, value, withNone) {
        var s = el('select', null, 'homey-form-select');
        s.id = id;
        LEVELS.forEach(function (l) {
          if (l === 'NONE' && !withNone) return;
          var o = el('option', t('level.' + l));
          o.value = l;
          if (l === value) o.selected = true;
          s.appendChild(o);
        });
        return s;
      }

      function renderNetworks() {
        var box = $('networkList');
        clear(box);
        var row = el('div', null, 'row');
        row.appendChild(el('div', t('defaultLevel'), 'who'));
        row.appendChild(levelSelect('level-default', config.defaultSeverity, false));
        box.appendChild(row);
        networks.forEach(function (key, i) {
          var r = el('div', null, 'row');
          r.appendChild(el('div', netLabel(key), 'who'));
          var s = levelSelect('level-' + i, config.severity[key] || '', true);
          var o = el('option', t('level.default'));
          o.value = '';
          if (!config.severity[key]) o.selected = true;
          s.insertBefore(o, s.firstChild);
          r.appendChild(s);
          box.appendChild(r);
        });
      }

      // Known devices fold up: the line shows the name, else the IP, else the MAC.
      // A click shows MAC, network, place, times and the buttons.
      function deviceFold(d, actions) {
        var box = el('details', null, 'dev');
        if (openMacs[d.mac]) box.open = true;
        box.addEventListener('toggle', function () {
          if (box.open) openMacs[d.mac] = true; else delete openMacs[d.mac];
        });
        var label = d.name || d.ip;
        var sum = el('summary', label ? label + ' ' + macTail(d.mac) : d.mac);
        sum.appendChild(el('small', t('state.' + d.state)));
        box.appendChild(sum);
        var info = el('div', null, 'info');
        info.appendChild(el('div', t('info.mac', { mac: d.mac })));
        info.appendChild(el('div', t('info.name', { name: d.name || '-' })));
        info.appendChild(el('div', t('info.ip', { ip: d.ip || '-' })));
        info.appendChild(el('div', t('info.network', { network: netLabel(d.network) })));
        info.appendChild(el('div', t('info.where', { where: d.where || '-' })));
        info.appendChild(el('div', t('info.seen', { first: when(d.firstSeen), last: when(d.lastSeen) })));
        var row = el('div', null, 'row');
        addButtons(row, d, actions);
        info.appendChild(row);
        box.appendChild(info);
        return box;
      }

      function renderDevices(list) {
        clear($('newList'));
        clear($('knownList'));
        var seen = {};
        list.forEach(function (d) {
          if (d.network) seen[d.network] = true;
          if (d.state === 'new') $('newList').appendChild(deviceRow(d, ['approve', 'ignore', 'forget']));
          else $('knownList').appendChild(deviceFold(d, ['unapprove', 'forget']));
        });
        if (!$('newList').firstChild) $('newList').appendChild(el('p', t('none'), 'muted'));
        if (!$('knownList').firstChild) $('knownList').appendChild(el('p', t('none'), 'muted'));
        if (formLoaded) return;
        Object.keys(config.severity).forEach(function (k) { seen[k] = true; });
        networks = Object.keys(seen).sort();
        renderNetworks();
        $('senders').value = config.senders.join(', ');
        $('logLevel').value = config.logLevel;
        formLoaded = true;
      }

      function renderSenders(s) {
        var box = $('seenSenders');
        clear(box);
        s.senders.forEach(function (x) {
          var r = el('div', null, 'row');
          r.appendChild(el('div', t('senderLine', {
            ip: x.ip, count: String(x.count), last: when(x.last), state: t(x.allowed ? 'allowed' : 'blocked'),
          }), 'who'));
          var b = el('button', t('action.add'), 'homey-button-secondary small');
          b.addEventListener('click', function () {
            var list = $('senders').value.split(/[\s,]+/).filter(Boolean);
            if (list.indexOf(x.ip) < 0) list.push(x.ip);
            $('senders').value = list.join(', ');
          });
          r.appendChild(b);
          box.appendChild(r);
        });
      }

      function renderStatus(s) {
        lastStatus = s;
        if (s.config) config = s.config;
        if (s.pinSet && !s.unlocked) token = null; // session ended (idle or app restart)
        var c = s.counts;
        $('status').textContent = t('statusLine', {
          listening: t(s.listening ? 'yes' : 'no'),
          packets: String(c.packets), events: String(c.events), unknown: String(c.unknown),
          bad: String(c.bad), foreign: String(c.foreign), fresh: String(c.new),
          approved: String(c.approved), ignored: String(c.ignored),
        }) + ' ' + t('statusLast', { last: when(s.lastPacket) });
        var w = [];
        if (!s.listening) w.push(t('warnNotListening'));
        if (s.silent) w.push(t('warnSilent'));
        if (!s.pinSet) w.push(t('warnNoPin'));
        if (s.locked) w.push(t('code.locked', { until: when(s.lockedUntil) }));
        if (s.unlocked && !config.senders.length) w.push(t('warnNoSenders'));
        $('warnings').textContent = w.join(' ');
        // Visibility is set on the element itself: Homey's own styles for
        // fieldsets and buttons win over a CSS class.
        setShown($('unlockBox'), !unlocked());
        setShown($('content'), unlocked());
        setShown($('removePin'), s.pinSet);
        if (s.senders) renderSenders(s);
      }

      function refresh() {
        Homey.api('POST', '/status', { token: token }, function (err, s) {
          if (err) { $('status').textContent = t('error'); return; }
          renderStatus(s);
          if (!unlocked()) return;
          Homey.api('POST', '/devices', { token: token }, function (err2, r) {
            if (!err2 && r.ok) renderDevices(r.devices);
          });
        });
      }

      $('unlock').addEventListener('click', function () {
        Homey.api('POST', '/unlock', { pin: $('unlockPin').value }, function (err, r) {
          $('unlockPin').value = '';
          if (!err && r.ok && r.token) token = r.token;
          show(err, r);
          if (!err && r.ok) $('result').textContent = '';
          refresh();
        });
      });

      $('saveConfig').addEventListener('click', function () {
        var severity = {};
        networks.forEach(function (key, i) {
          var v = $('level-' + i).value;
          if (v) severity[key] = v;
        });
        var next = {
          senders: $('senders').value.split(/[\s,]+/).filter(Boolean),
          severity: severity,
          defaultSeverity: $('level-default').value,
          logLevel: $('logLevel').value,
        };
        Homey.api('POST', '/config', { token: token, config: next }, function (err, r) {
          show(err, r);
          if (!err && r.ok) { formLoaded = false; $('result').textContent = t('code.saved'); }
          refresh();
        });
      });

      $('savePin').addEventListener('click', function () {
        Homey.api('POST', '/pin', { token: token, newPin: $('newPin').value }, function (err, r) {
          $('newPin').value = '';
          if (!err && r.ok && r.token) token = r.token;
          show(err, r);
          refresh();
        });
      });

      // Two presses instead of Homey.confirm: on the real Homey the confirm
      // callback never ran, so the PIN could not be removed. The second press
      // must come within 10 seconds.
      var removeArmed = null;
      function disarmRemove() {
        clearTimeout(removeArmed);
        removeArmed = null;
        $('removePin').textContent = t('removePin');
      }
      $('removePin').addEventListener('click', function () {
        if (!removeArmed) {
          removeArmed = setTimeout(function () { disarmRemove(); $('result').textContent = ''; }, 10000);
          $('removePin').textContent = t('removePinAgain');
          $('result').textContent = t('removePinConfirm');
          return;
        }
        disarmRemove();
        Homey.api('POST', '/pin/remove', { token: token }, function (err, r) {
          show(err, r);
          refresh();
        });
      });

      // Option texts are set here, not with data-i18n, to be sure they are translated.
      Array.prototype.forEach.call($('logLevel').options, function (o) { o.textContent = t('log.' + o.value); });

      refresh();
      Homey.ready();
    }
  </script>
</body>
</html>
